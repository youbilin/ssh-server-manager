name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --user pyyaml >/dev/null 2>&1 || true
      - name: Install PyYAML (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --user pyyaml >/dev/null 2>&1 || true
      - name: Run offline tests
        shell: bash
        run: bash tests/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh tests/*.sh tools/*.sh

  codex-sync:
    name: codex build is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated Codex copy
        run: bash tools/build-codex.sh --check
